const isF=Z=>(Z>=57&&Z<=70)||(Z>=89&&Z<=102);
const amb=Z=>(Z>=57&&Z<=71)||(Z>=89&&Z<=103);   // خانه‌هایی که گروه+دوره یکتا نیست
function posOf(Z){
  if(Z>=57&&Z<=70)return{r:9,c:3+Z-57};
  if(Z>=89&&Z<=102)return{r:10,c:3+Z-89};
  let r,c;
  if(Z<=2){r=1;c=Z==1?1:18}
  else if(Z<=4){r=2;c=Z-2}
  else if(Z<=10){r=2;c=Z+8}
  else if(Z<=12){r=3;c=Z-10}
  else if(Z<=18){r=3;c=Z}
  else if(Z<=36){r=4;c=Z-18}
  else if(Z<=54){r=5;c=Z-36}
  else if(Z<=56){r=6;c=Z-54}
  else if(Z<=86){r=6;c=Z-68}
  else if(Z<=88){r=7;c=Z-86}
  else{r=7;c=Z-100}
  return{r,c};
}
const SUP={0:'⁰',1:'¹',2:'²',3:'³',4:'⁴',5:'⁵',6:'⁶',7:'⁷',8:'⁸',9:'⁹'};
const sup=n=>String(n).replace(/\d/g,d=>SUP[d]);
function config(Z){
  if(Z>36)return null;
  const ord=[['1s',2],['2s',2],['2p',6],['3s',2],['3p',6],['4s',2],['3d',10],['4p',6]];
  const exc=(Z==24||Z==29);let left=Z;const fill={};
  for(const [k,c] of ord){
    if(exc&&k=='4s'){fill[k]=1;left-=1;continue}
    if(exc&&k=='3d'){fill[k]=left;left=0;continue}
    const n=Math.min(c,left);fill[k]=n;left-=n;
  }
  return ord.filter(o=>fill[o[0]]>0).map(o=>o[0]+sup(fill[o[0]])).join(' ');
}

  const block=f?'f':(Z==2||group<=2)?'s':group>=13?'p':'d';
  const e={Z,sym,fa:nf,en,r:p.r,c:p.c,group,period,block};
  e.cat=ALK.has(sym)?'alk':AE.has(sym)?'ae':HAL.has(sym)?'hal':group==18?'ng':MTD.has(sym)?'mtd':block=='f'?'f':block=='d'?'d':NONM.has(sym)?'nm':'pm';
  e.state=(Z>=104||sym=='Fr'||sym=='At')?null:GAS.has(sym)?'gas':LIQ.has(sym)?'liq':'sol';
  e.cfg=config(Z);
  e.val=(Z==2)?2:group<=2?group:(group>=13&&block=='p')?group-10:null;
  e.inFiles=Z<=36||EXTRA.has(sym);
  e.source=e.inFiles?'user_files':'standard_chemistry';

});

function mastery(z){
  const r=st.el[z];if(!r)return 0;
  const v=Object.values(r.sk).sort((a,b)=>b-a).slice(0,4);while(v.length<4)v.push(0);
  return Math.round(100*v.reduce((a,b)=>a+b,0)/4);
}
const lvlOf=p=>p>=90?3:p>=70?2:p>=40?1:0;
const LV_EMOJI=['🔴','🟠','🟢','💎'],LV_FA=['ضعیف','در حال یادگیری','خوب','مسلط'];

const masteredList=P=>P.filter(e=>mastery(e.Z)>=90);
function avgMastery(P){return P.length?Math.round(P.reduce((a,e)=>a+mastery(e.Z),0)/P.length):0}
const PLAYER=[[0,'🧪 مبتدی'],[15,'⚗️ شاگرد آزمایشگاه'],[40,'🔬 شیمی‌دان'],[70,'🧬 متخصص'],[90,'💎 Master Chemist']];
function playerLevel(P){const a=avgMastery(P);let r=PLAYER[0];PLAYER.forEach(x=>{if(a>=x[0])r=x});return r[1]}
function recordAnswer(q,ok){
  for(const z of q.zs){
    const r=st.el[z]||(st.el[z]={sk:{},c:0,w:0,box:0,due:0});
    const s=r.sk[q.skill]||0;
    let ns=ok?s+(1-s)*0.65:s*0.5;if(ns>0.985)ns=1;r.sk[q.skill]=Math.round(ns*1000)/1000;
    if(ok){r.c++;r.box=Math.min(5,r.box+1);r.due=st.cnt+[2,4,8,16,32,64][r.box]}
    else{r.w++;r.box=0;r.due=st.cnt+2}
  }
  st.cnt++;st.stats.ans++;
  if(ok){st.stats.ok++;st.stats.streak++;st.stats.best=Math.max(st.stats.best,st.stats.streak)}else st.stats.streak=0;
  const d=new Date().toISOString().slice(0,10);st.daily[d]=(st.daily[d]||0)+1;
}

/* ---------- Helpers for questions ---------- */
const explOf=e=>`${L(e.sym)} — ${e.fa} · عدد اتمی ${fa(e.Z)} · گروه ${fa(e.group)} · دورهٔ ${fa(e.period)}`;
function ND(e,P,n,flt){
  const c=P.filter(x=>x.Z!==e.Z&&(!flt||flt(x)));
  const sc=x=>{let s=Math.abs(x.Z-e.Z);if(x.group===e.group)s-=4;if(x.period===e.period)s-=3;if(x.sym[0]===e.sym[0])s-=2;return s+Math.random()*5};
  const top=c.map(x=>[sc(x),x]).sort((a,b)=>a[0]-b[0]).slice(0,Math.max(n+3,7)).map(x=>x[1]);
  return shuffle(top).slice(0,n);
}
function numD(v,lo,hi,n=3){const c=[];for(let d=1;d<=7;d++){if(v-d>=lo)c.push(v-d);if(v+d<=hi)c.push(v+d)}return shuffle(c.slice(0,Math.max(n+3,6))).slice(0,n)}
function mk(o){
  const all=[o.c,...o.w];
  if(all.length<2||new Set(all.map(x=>plain(x[0]))).size!==all.length)return null;
  const sh=shuffle(all);
  return{id:Date.now().toString(36)+rnd(1e6).toString(36),type:o.type,skill:o.skill,prompt:o.prompt,kind:o.kind||'mc',
    opts:sh.map(x=>x[0]),ov:sh.map(x=>x[1]),ans:sh.indexOf(o.c),zs:o.zs,expl:o.expl||'',meta:o.meta||{},tbl:o.tbl||null,lvl:2};
}

 case 'cls':return inCls(CLS[m.cl],e)===true;case 'state':return e.state===m.v;case 'stem':return e.stems.includes(m.v);}};

function validateQuestion(q){
  try{
    if(!q||!q.prompt||!q.zs||!q.zs.length)return false;
    if(q.kind=='grid')return q.ans===q.meta.Z&&!!EL[q.ans-1];
    if(q.opts.length<2||new Set(q.opts.map(plain)).size!==q.opts.length)return false;
    if(q.type=='T14'){
      const zs=q.ov,k=q.meta.kind,els=zs.map(z=>EL[z-1]),ms=els.map(MET[k]);
      if(new Set(ms).size!==ms.length)return false;
      if(['sizeP','nmP'].includes(k)&&!els.every(x=>x.period===els[0].period&&okg(x)))return false;
      if(['sizeG','metG','nmG'].includes(k)&&!els.every(x=>x.group===els[0].group&&okg(x)))return false;
      if((k=='nmP'&&!els.every(x=>x.group>=13))||(k=='nmG'&&els[0].group<14))return false;
      const bi=ms.indexOf(Math.max(...ms));return bi===q.ans;
    }
    const f=OKF[q.type];if(!f)return false;
    const ok=q.ov.map(v=>f(q,v));
    if(q.type=='T17'&&q.ov.includes(-1)&&q.ov.indexOf(-1)===q.ans)return false;
    return ok.filter(Boolean).length===1&&ok[q.ans]===true;
  }catch(err){return false}
}

let recentT=[];
const levelForMastery=m=>m<25?1:m<50?2:m<75?3:m<90?4:5;
function weightOf(e){
  const m=mastery(e.Z),r=st.el[e.Z];
  let w=!r?4:m>=90?1:m>=70?1.5:m>=40?2:5;
  if(r)w*=(r.due<=st.cnt)?2.2:0.8;
  return w;
}
function pickTarget(P){
  const cand=P.filter(e=>!recentT.includes(e.Z));
  const pool=cand.length>=Math.min(2,P.length)?cand:P;
  const ws=pool.map(weightOf),tot=ws.reduce((a,b)=>a+b,0);
  let r=Math.random()*tot;for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0){recentT.push(pool[i].Z);if(recentT.length>3)recentT.shift();return pool[i]}}
  return pool[pool.length-1];
}
function genQuestion(o={}){
  const P=o.P||poolEls();
  const cands=o.zs&&o.zs.length?o.zs.map(z=>EL[z-1]):P;
  for(let t=0;t<60;t++){

  const P2=EL.slice(0,36);return G.T3(P2[16],P2);
}

const NGZ=[2,10,18,36,54,86,118],NGP=[1,2,3,4,5,6,7];
function ngCalc(e){
  const Z=e.Z;
  if(isF(Z))return{g:3,p:Z<=70?6:7,text:'لانتانیدها (عدد اتمی ۵۷ تا ۷۰) در گروه ۳ و دورهٔ ۶ و اکتینیدها (۸۹ تا ۱۰۲) در گروه ۳ و دورهٔ ۷ قرار دارند و خارج از جدول نوشته می‌شوند.'};
  const i=NGZ.indexOf(Z);
  if(i>=0)return{g:18,p:NGP[i],text:`${e.fa} خودش گاز نجیب دورهٔ ${fa(NGP[i])} است (عدد اتمی ${fa(Z)}).`};
  if(Z==1)return{g:1,p:1,text:'هیدروژن استثناست: گروه ۱ و دورهٔ ۱ (هر چند نافلز است).'};
  const ex=['B','C','Al','Si'].includes(e.sym);
  let b=0;NGZ.forEach((z,k)=>{if(Math.abs(z-Z)<Math.abs(NGZ[b]-Z))b=k});

  const d=ng-Z,g=18-d,p=NGP[b];
  return{g,p,text:`${ex?'استثنای فایل (از گاز نجیب بعدی حساب کن): ':''}گاز نجیب ${ngs.fa} (${L(ngs.sym)}، ${fa(ng)}). ${fa(ng)} − ${fa(Z)} = ${fa(d)} ← گروه ۱۸ − ${fa(d)} = ${fa(g)}؛ دوره همان دورهٔ گاز نجیب = ${fa(p)}.`};
}

function stageP(i){
  const S=STAGES[i];if(S.final)return S.zs.map(z=>EL[z-1]);
  const set=new Set();for(let k=0;k<=i;k++)if(!STAGES[k].final)STAGES[k].zs.forEach(z=>set.add(z));
  let arr=[...set];
  if(arr.length<14){const mid=S.zs.reduce((a,z)=>a+z,0)/S.zs.length;
    EL.filter(e=>e.Z<=36&&!set.has(e.Z)).sort((a,b)=>Math.abs(a.Z-mid)-Math.abs(b.Z-mid)).forEach(e=>{if(arr.length<14)arr.push(e.Z)})}
  return arr.map(z=>EL[z-1]);
}
function examTargets(i){
  const S=STAGES[i];

  let t=[];while(t.length<12)t=t.concat(shuffle(S.zs));return t.slice(0,12);
}

}

/* ---------- table renderer ---------- */
function tableHTML(o){
  const mode=o.mode,cs={normal:38,heat:30,raw:26,pick:26}[mode];
  let h=`<div class="tbl"><div class="tgrid ${mode}" style="--cs:${cs}px"><i class="ax"></i>`;
  for(let c=1;c<=18;c++)h+=`<i class="ax">${fa(c)}</i>`;
  for(let r=1;r<=10;r++){
    if(r==8){h+='<div class="sp8"></div>';continue}
    h+=`<i class="ax">${r<=7?fa(r):(r==9?'۶*':'۷*')}</i>`;
    for(let c=1;c<=18;c++){
      const z=cellAt(r,c);
      if(!z){h+='<i class="e"></i>';continue}
      const e=EL[z-1];let cl='cell',inner='',act='';
      if(mode=='normal'){cl+=` c-${e.cat} act`;inner=`<s>${fa(z)}</s><b>${e.sym}</b><small>${e.fa}</small>`;act=`data-a="prof" data-z="${z}"`}
      else if(mode=='heat'){
        const inP=inPool(e),m=mastery(z);
        cl+=` ${inP?(seen(z)?'h-'+lvlOf(m):'h-u'):'h-u dim'} act`;
        inner=`<b>${e.sym}</b><small>${inP&&seen(z)?fa(m)+'٪':''}</small>`;act=`data-a="prof" data-z="${z}"`;
      }else if(mode=='pick'){cl+=' act';inner=`<b>${e.sym}</b>`;act=`data-a="cell" data-z="${z}"`}
      else{inner=`<b>${e.sym}</b>`}
      if(o.hl===z)cl+=' hl';
      if(o.ok===z)cl+=' ok';
      if(o.bad===z)cl+=' bad';
      h+=`<div class="${cl}" ${act}>${inner}</div>`;
    }
  }
  return h+'</div></div>';
}

function qBody(q){
  let b='';
  if(q.tbl)b+=tableHTML({mode:'raw',hl:q.tbl.hl});
  if(q.kind=='grid'){
    const bad=ui.ans&&ui.pick!==q.ans?ui.pick:0;
    b+=tableHTML({mode:'pick',ok:ui.ans?q.ans:0,bad});
    if(!ui.ans)b+='<div class="hint">روی خانهٔ درست در جدول بزن (برای دیدن همهٔ ستون‌ها جدول را بکش).</div>';
  }else{
    b+=`<div class="opts ${q.opts.length==2?'two':''}" style="margin-top:.6rem">`+q.opts.map((o,i)=>{
      let c='opt';if(ui.ans){if(i===q.ans)c+=' ok';else if(i===ui.pick)c+=' bad';else c+=' dim'}
      return `<button class="${c}" data-a="ans" data-i="${i}" ${ui.ans?'disabled':''}><span class="k">${fa(i+1)}</span><span>${o}</span></button>`}).join('')+'</div>';
  }
  return b;
}
function rQuiz(){
  const s=ui.sess,q=ui.q;if(!s||!q)return '';
  const P=poolEls();let prog;
  const cur=ui.ans?s.n:s.n+1;
  if(s.rush)prog=`<span class="badge">⏱ <b id="tmr">${fa(Math.max(0,Math.ceil((s.endAt-Date.now())/1000)))}</b></span><span class="badge">✓ ${fa(s.ok)}</span><span class="sp"></span>`;
  else if(s.total)prog=`<div class="bar"><i style="width:${Math.min(100,s.n/s.total*100)}%"></i></div><span class="badge">${s.mode=='exam'?'🎯 ':''}${fa(Math.min(cur,s.total))} / ${fa(s.total)}</span>`;
  else prog=`<div class="bar"><i style="width:${Math.min(100,s.n*2)}%"></i></div><span class="badge">♾ ${fa(s.n)}</span>`;
  let fb='';
  if(ui.ans&&!s.rush){
    const ok=ui.pick===q.ans,e=EL[q.zs[0]-1];
    const last=!s.queue?(s.total&&s.n>=s.total):s.queue.length==0;
    const ngq=!ok&&['T5','T6','T7','T8','T9','T11'].includes(q.type)&&e?`<div class="tip">🧭 ترفند گاز نجیب: ${ngCalc(e).text}</div>`:'';
    const showOpt=q.kind=='mc'&&!['T16','T17','T20'].includes(q.type);
    fb=ok?`<div class="fb ok"><b>🎯 درست!</b> عالیه؛ این مورد رو بلدی.<div class="hint ans">${q.expl}</div></div>`
         :`<div class="fb bad"><b>✕ اشتباه</b><div class="ans">پاسخ صحیح: ${showOpt?q.opts[q.ans]+'<div class="hint">'+q.expl+'</div>':q.expl}</div><div class="hint">این مورد را دوباره مرور می‌کنیم.</div></div>`;
    fb+=ngq;
    if(e&&e.tip)fb+=`<div class="tip">💡 نکته: ${e.tip}</div>`;
    fb+=`<div class="row" style="margin-top:.7rem"><button class="btn pri" data-a="next">${last?'پایان جلسه':'بعدی ↵'}</button><button class="btn sm" data-a="prof" data-z="${e.Z}">📇 کارت ${e.sym}</button><button class="btn sm" data-a="bm" data-z="${e.Z}">${st.bm.includes(e.Z)?'★ نشان‌شده':'☆ نشان‌گذاری'}</button></div>`;
  }
  return `<div class="qtop">${prog}<span class="badge">🔥 ${fa(st.stats.streak)}</span>${s.stage!=null?`<span class="badge">${STAGES[s.stage].ic} ${s.mode=='exam'?'آزمون':'تمرین'}</span>`:(s.rush||s.mode=='review'||s.mode=='focus')?'':`<span class="badge">سطح: ${LEVEL_FA[st.lvl]}</span>`}<button class="btn sm dng" data-a="stop">${s.mode=='exam'?'انصراف':'پایان'}</button></div>
  <section class="card ${ui.ans?(ui.pick===q.ans?'pulse':'shake'):''}"><div class="qtype">${TYPE_FA[q.type]}</div><div class="qtext">${q.prompt}</div>${qBody(q)}${fb}</section>
  <div class="brandline">VALERON · @valeronlife2006</div>`;
}
function rResult(){

  const S=s.stage!=null?STAGES[s.stage]:null;
  let head,btns='';
  if(s.rush){head=`<div class="big-n">⚡ ${fa(s.ok)}</div><h2>پاسخ درست در ۶۰ ثانیه</h2>${s.newBest?'<div class="chip on">🏅 رکورد جدید!</div>':`<div class="hint">رکورد: ${fa(st.rush[s.rush]||0)}</div>`}`}

      btns=`<button class="btn pri" data-a="go" data-s="road">${nx?'▶ مرحلهٔ بعد: '+nx.t:'🗺️ نقشهٔ راه'}</button>`}
    else{head=`<div class="big-n" style="color:var(--o)">🎯 ${fa(acc)}٪</div><h2>برای قبولی ${fa(PASS)}٪ لازم است</h2><div class="hint">اشکالی ندارد؛ چند دور تمرین هدفمند و دوباره آزمون.</div>`;
      btns=`<button class="btn pri" data-a="practice" data-i="${s.stage}">🔁 تمرین مرحله</button><button class="btn yel" data-a="exam" data-i="${s.stage}">🎯 آزمون دوباره</button>`}
  }else if(s.mode=='stage'){

    btns=`<button class="btn pri" data-a="practice" data-i="${s.stage}">🔁 ادامهٔ تمرین</button>${av>=EXAM_AT?`<button class="btn yel" data-a="exam" data-i="${s.stage}">🎯 آزمون مرحله</button>`:''}`;
  }else head=`<div class="big-n">🎉 Session Complete</div>`;
  if(!btns)btns=`<button class="btn pri" data-a="again">🔁 جلسهٔ جدید</button>`;
  return `<section class="card" style="text-align:center">${head}
   <div class="grid2" style="margin:.8rem 0"><div class="stat"><b>${fa(s.n)}</b><small>سؤال</small></div><div class="stat"><b style="color:var(--g)">✓ ${fa(s.ok)}</b><small>صحیح</small></div><div class="stat"><b style="color:var(--r)">✕ ${fa(s.n-s.ok)}</b><small>غلط</small></div><div class="stat"><b>${fa(acc)}٪</b><small>دقت</small></div></div>
   ${weak.length?`<div class="hint">عناصر نیازمند مرور</div><div class="chips" style="justify-content:center;margin:.4rem 0 .8rem">${weak.map(e=>`<button class="ec" data-a="prof" data-z="${e.Z}">${e.sym}</button>`).join('')}</div>`:''}
   <div class="row" style="justify-content:center">${btns}

    <button class="btn" data-a="go" data-s="road">🗺️ نقشهٔ راه</button></div></section>

  o.push(`Warnings: ${d.warnings.length}`);d.warnings.forEach(w=>o.push(' - '+w));
  o.push('','== Question Generator QA (pool: '+st.set.pool+') ==');
  const P=poolEls();
  Object.keys(G).forEach(t=>{let g=0,v=0;for(let i=0;i<40;i++){const e=P[rnd(P.length)];let q=null;try{q=G[t](e,P)}catch(x){}if(q){g++;if(validateQuestion(q))v++}}o.push(`${t} ${TYPE_FA[t]}: generated ${g}/40, valid ${v}/${g}`)});
  const cl=SYM.Cl;o.push('','Cl → '+Object.keys(G).filter(t=>{let q=null;try{q=G[t](cl,EL.filter(e=>e.Z<=36))}catch(x){}return q&&validateQuestion(q)}).join(', '));
  ui.qaText=o.join('\n').replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* ---------- session logic ---------- */
function startSession(o){
  clearInterval(ui.tick);
  const s={mode:o.mode,total:o.total||0,n:0,ok:0,bad:[],byEl:{},types:o.types||null,zs:o.zs||null,P:o.P||null,perEl:!!o.perEl,rush:o.rush||null,stage:o.stage==null?null:o.stage,
    targets:o.targets||null,endAt:o.time?Date.now()+o.time*1000:0,queue:o.queue||null,recent:[],done:false};
  if(s.queue)s.total=s.queue.length;
  if(s.targets)s.total=s.targets.length;
  ui.sess=s;ui.screen='quiz';ui.msg='';
  if(o.time){ui.tick=setInterval(()=>{const left=Math.max(0,Math.ceil((s.endAt-Date.now())/1000));const t=document.getElementById('tmr');if(t)t.textContent=fa(left);if(left<=0&&!s.done)finish()},250)}
  nextQ();
}
function startPractice(i){const S=STAGES[i];startSession({mode:'stage',stage:i,zs:S.zs,P:stageP(i),perEl:true,total:15})}
function startExam(i){startSession({mode:'exam',stage:i,targets:examTargets(i),P:stageP(i),types:EXAM_TYPES})}
function startLearn(i){ui.learn={i,k:0};ui.screen='learn';render();window.scrollTo(0,0)}
function nextQ(){
  const s=ui.sess;if(!s||s.done)return;
  if(s.queue){if(!s.queue.length)return finish();ui.q=reshuffleQ(s.queue.shift())}
  else if(s.targets){if(s.n>=s.targets.length)return finish();ui.q=genQuestion({zs:[s.targets[s.n]],P:s.P,types:s.types})}
  else{
    if(s.total&&s.n>=s.total)return finish();
    ui.q=genQuestion({types:s.types,zs:s.zs,P:s.P,perEl:s.perEl});
  }
  ui.ans=false;ui.pick=null;render();
}
function finish(){
  const s=ui.sess;clearInterval(ui.tick);
  if(!s||s.done)return;
  s.done=true;
  if(s.rush){const b=st.rush[s.rush]||0;if(s.ok>b){st.rush[s.rush]=s.ok;s.newBest=true}}
  let celeb=false;
  if(s.mode=='exam'){
    if(s.n<s.total){ // انصراف
      save();ui.screen='road';render();window.scrollTo(0,0);return}
    const acc=Math.round(100*s.ok/s.n),S=STAGES[s.stage],r=st.road[S.id]||(st.road[S.id]={});
    r.best=Math.max(r.best||0,acc);
    if(acc>=PASS){s.passed=true;r.cleared=true;if(S.final)celeb=true}
  }
  save();ui.screen=s.n?'result':(s.stage!=null?'road':'setup');render();window.scrollTo(0,0);
  if(celeb)showCeleb();
}
function adapt(s){
  if(s.rush||s.mode=='review'||s.perEl||s.targets)return;
  const r=s.recent,okc=r.filter(Boolean).length;
  if(r.length>=5&&okc>=5&&st.lvl<5){st.lvl++;s.recent=[]}
  else{const l3=r.slice(-3);if(l3.length==3&&l3.filter(x=>!x).length>=2&&st.lvl>1){st.lvl--;s.recent=[]}}
}
function addWrong(q){if(st.wrong.some(w=>w.id===q.id))return;st.wrong.unshift(JSON.parse(JSON.stringify(q)));if(st.wrong.length>120)st.wrong.length=120}
function removeWrong(id){st.wrong=st.wrong.filter(w=>w.id!==id)}
function answer(i){
  const q=ui.q,s=ui.sess;if(!q||!s||ui.ans||s.done)return;
  const ok=i===q.ans;ui.ans=true;ui.pick=i;
  recordAnswer(q,ok);
  s.n++;if(ok)s.ok++;else{s.bad.push(q);addWrong(q)}
  if(s.mode=='review'&&ok)removeWrong(q.id);
  const z=q.zs[0],be=s.byEl[z]||(s.byEl[z]={c:0,w:0});ok?be.c++:be.w++;
  s.recent.push(ok);if(s.recent.length>6)s.recent.shift();
  adapt(s);save();
  render();
  if(s.rush)setTimeout(()=>{if(ui.sess===s&&!s.done)nextQ()},ok?650:1500);
}

function act(a,t){
  const d=t.dataset;

    case 'go':go(d.s);break;
    case 'theme':st.set.theme=st.set.theme=='dark'?'light':'dark';save();render();break;
    case 'font':st.set.font=Math.min(1.4,Math.max(.85,Math.round((st.set.font+d.d*.1)*100)/100));save();render();break;
    case 'pool':setSetPool(d.p);break;

    case 'start':startSession({mode:d.m,total:d.m=='size'?ui.size:0});break;
    case 'learn':startLearn(+d.i);break;
    case 'lnext':ui.learn.k++;render();window.scrollTo(0,0);break;
    case 'lprev':ui.learn.k=Math.max(0,ui.learn.k-1);render();window.scrollTo(0,0);break;
    case 'ldone':{const S=STAGES[ui.learn.i],r=st.road[S.id]||(st.road[S.id]={});r.learned=true;save();ui.msg='آموزش مرحله تمام شد؛ حالا برو سراغ تمرین هدایت‌شده.';ui.screen='road';render();window.scrollTo(0,0);break}
    case 'practice':startPractice(+d.i);break;
    case 'exam':startExam(+d.i);break;
    case 'doNext':{const na=nextAction();if(na.done){go('road')}else if(na.kind=='learn')startLearn(na.i);else if(na.kind=='practice')startPractice(na.i);else startExam(na.i);break}
    case 'focus':{
      const P=poolEls();
      let zs=d.m=='weak'?P.filter(e=>seen(e.Z)&&mastery(e.Z)<70).map(e=>e.Z):st.bm.filter(z=>inPool(EL[z-1]));
      if(!zs.length){ui.msg=d.m=='weak'?'هنوز عنصر ضعیفی ثبت نشده؛ اول چند جلسه تمرین کن.':'هنوز عنصری نشان‌گذاری نکرده‌ای (در کارت عنصر ☆ را بزن).';ui.screen='setup';render();break}
      startSession({mode:'focus',zs,total:Math.max(10,Math.min(30,zs.length*3))});break}
    case 'pz':closeModal();startSession({mode:'focus',zs:[+d.z],total:10});break;
    case 'reviewAll':
      if(!st.wrong.length){ui.msg='اشتباه ذخیره‌شده‌ای وجود ندارد.';ui.screen='setup';render();break}
      startSession({mode:'review',queue:shuffle(st.wrong).slice(0,30)});break;
    case 'reviewSess':startSession({mode:'review',queue:shuffle(ui.sess.bad)});break;
    case 'again':ui.screen='setup';render();break;
    case 'rush':{
      const m={atomic:['T1','T2'],elem:['T4'],table:['T10']}[d.k];
      startSession({mode:'rush',rush:d.k,types:m,time:60});break}
    case 'ans':answer(+d.i);break;
    case 'cell':if(ui.q&&ui.q.kind=='grid')answer(+d.z);break;
    case 'next':nextQ();break;
    case 'stop':finish();break;
    case 'memtab':ui.memTab=d.t;render();break;
    case 'tb':ui.tb=d.m;render();break;
    case 'prof':showProf(+d.z);break;
    case 'bm':{const z=+d.z,i=st.bm.indexOf(z);if(i>=0)st.bm.splice(i,1);else st.bm.push(z);save();
      if($('#modal').classList.contains('on'))showProf(z);else render();break}
    case 'close':closeModal();break;
    case 'closeCeleb':$('#celeb').classList.remove('on');break;
    case 'qa':runQA();render();break;
    case 'reset':if(confirm('تمام پیشرفت (تسلط، پاسخ‌ها، اشتباهات و رگه‌ها) پاک شود؟')){const set=st.set;st=defState();st.set=set;recentT=[];save();ui.qaText='';ui.screen='home';render()}break;
  }
}
document.addEventListener('click',ev=>{
  if(ev.target.id=='modal'){closeModal();return}
  const t=ev.target.closest('[data-a]');if(!t||t.tagName=='SELECT')return;act(t.dataset.a,t);
});
document.addEventListener('change',ev=>{if(ev.target.id=='goalSel'){st.set.goal=+ev.target.value;save()}});
document.addEventListener('keydown',ev=>{
  if(ev.key=='Escape'){closeModal();return}
  if(ui.screen!='quiz'||!ui.q||document.getElementById('modal').classList.contains('on'))return;
  if(!ui.ans&&ui.q.kind=='mc'){const n=parseInt(ev.key.replace(/[۰-۹]/g,c=>PD.indexOf(c)),10);if(n>=1&&n<=ui.q.opts.length){answer(n-1);ev.preventDefault();return}}
  if(ui.ans&&!ui.sess.rush&&(ev.key=='Enter'||ev.key==' '||ev.key=='ArrowLeft')){ev.preventDefault();nextQ()}
});
setInterval(()=>{if(!document.hidden&&ui.screen=='quiz'&&ui.sess&&!ui.sess.done){st.stats.sec++;if(st.stats.sec%15==0)save()}},1000);
window.addEventListener('pagehide',save);

/* ---------- init ---------- */
(function(){
  const fx=$('#bgfx');
  fx.innerHTML=Array.from({length:16},()=>`<span style="left:${rnd(94)}%;animation-duration:${28+rnd(34)}s;animation-delay:-${rnd(50)}s;font-size:${1.6+rnd(30)/10}rem">${EL[rnd(36)].sym}</span>`).join('');
  load();render();
})();
</script>
